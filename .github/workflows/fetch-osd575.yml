name: Fetch and audit NASA OSD-575

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-osd575.yml"
  workflow_dispatch:
    inputs:
      confirm_download:
        description: "Confirm a live download of the public OSD-575 transformed CSV"
        required: true
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

permissions:
  contents: read

concurrency:
  group: osd575-live-fetch
  cancel-in-progress: false

jobs:
  fetch-and-audit:
    if: ${{ github.event_name == 'push' || inputs.confirm_download == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate script syntax
        run: node --check scripts/fetch-osd575.js

      - name: Run automated tests
        run: npm test

      - name: Fetch live OSD-575 metadata, catalog and transformed CSV
        run: node scripts/fetch-osd575.js

      - name: Upload raw data and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osd575-live-audit-${{ github.run_id }}
          path: data/osdr/OSD-575/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30
