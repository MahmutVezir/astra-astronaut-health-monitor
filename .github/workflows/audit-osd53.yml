name: Audit NASA OSDR OSD-53 metadata, files and archive structure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-osd53.yml"
      - "scripts/audit-osd53.js"
      - "scripts/inspect_osd53_archives.py"
      - "tests/osd53-audit.test.js"
      - "tests/test_osd53_archive_inspection.py"
      - "src/core/osdr-client.js"

permissions:
  contents: read

concurrency:
  group: osd53-audit
  cancel-in-progress: false

jobs:
  audit-public-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out ASTRA repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Node.js audit script syntax
        run: node --check scripts/audit-osd53.js
      - name: Run OSD-53 Node.js unit tests
        run: node --test tests/osd53-audit.test.js
      - name: Run OSD-53 archive inspection unit tests
        run: python -m unittest discover -s tests -p 'test_osd53_archive_inspection.py' -v
      - name: Fetch NASA metadata, exact public archives and integrity evidence
        run: node scripts/audit-osd53.js
      - name: Inspect ZIP structure and tabular metadata without persisting extracted files
        run: python scripts/inspect_osd53_archives.py artifacts/osd53-audit/files artifacts/osd53-audit/summary.json
      - name: Preserve raw NASA responses and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osd53-metadata-file-and-archive-audit-${{ github.run_id }}
          path: artifacts/osd53-audit/
          if-no-files-found: warn
          retention-days: 30
